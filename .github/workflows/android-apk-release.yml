name: Android APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

      - name: Verify Android signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Set ANDROID_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Set ANDROID_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Set ANDROID_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Set ANDROID_KEY_PASSWORD in repository Actions secrets."; exit 1; }

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAL_RELEASE_STORE_FILE: app/release-key.jks
          ORG_GRADLE_PROJECT_MYAL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          chmod 600 android/app/release-key.jks
          cd android
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature and create checksums
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          output="MyAl-Client-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$output"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print -quit)"
          if [ -z "$apksigner_path" ]; then
            echo "::error::Android build tools did not provide apksigner."
            exit 1
          fi
          "$apksigner_path" verify --verbose "$output"
          sha256sum "$output" > "$output.sha256"
          certificate="$("$apksigner_path" verify --print-certs "$output")"
          fingerprint="$(printf '%s\n' "$certificate" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [ -z "$fingerprint" ]; then
            echo "::error::Could not read APK signing certificate fingerprint."
            exit 1
          fi
          printf 'Android signing certificate SHA-256: %s\n' "$fingerprint" > "MyAl-Client-${GITHUB_REF_NAME}.signing-certificate.txt"

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyAl-Client-${{ github.ref_name }}.apk
            MyAl-Client-${{ github.ref_name }}.apk.sha256
            MyAl-Client-${{ github.ref_name }}.signing-certificate.txt
