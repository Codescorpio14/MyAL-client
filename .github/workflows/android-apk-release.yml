name: Android APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build signed beta APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Android signing verification tools
        uses: android-actions/setup-android@v3

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify release tag matches app version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

      - name: Build signed APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN Actions secret before publishing a release."
            exit 1
          fi
          sdkmanager "build-tools;35.0.0"
          eas build --platform android --profile release --non-interactive --wait --json > eas-build.json
          build_url="$(node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
            const build = Array.isArray(result) ? result.at(-1) : result;
            const url = build?.artifacts?.buildUrl;
            if (typeof url !== "string" || !url) process.exit(1);
            process.stdout.write(url);
          ')"
          curl --fail --location "$build_url" --output "MyAl-Client-${GITHUB_REF_NAME}.apk"
          test -s "MyAl-Client-${GITHUB_REF_NAME}.apk"
          sha256sum "MyAl-Client-${GITHUB_REF_NAME}.apk" > "MyAl-Client-${GITHUB_REF_NAME}.apk.sha256"
          certificate="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "MyAl-Client-${GITHUB_REF_NAME}.apk")"
          fingerprint="$(printf '%s\n' "$certificate" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [ -z "$fingerprint" ]; then
            echo "::error::Could not read APK signing certificate fingerprint."
            exit 1
          fi
          printf 'Android signing certificate SHA-256: %s\n' "$fingerprint" > "MyAl-Client-${GITHUB_REF_NAME}.signing-certificate.txt"

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MyAl-Client-${{ github.ref_name }}.apk
            MyAl-Client-${{ github.ref_name }}.apk.sha256
            MyAl-Client-${{ github.ref_name }}.signing-certificate.txt
