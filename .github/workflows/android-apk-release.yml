name: Android APK release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to attach the APK to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches app version
        run: |
          expected="v$(node -p 'require(\"./package.json\").version')"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $expected"
            exit 1
          fi

      - name: Verify Android signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Set ANDROID_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Set ANDROID_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Set ANDROID_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Set ANDROID_KEY_PASSWORD in repository Actions secrets."; exit 1; }

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAL_RELEASE_STORE_FILE: app/release-key.jks
          ORG_GRADLE_PROJECT_MYAL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          chmod 600 android/app/release-key.jks
          cd android
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          output="MyAl-Client-${RELEASE_TAG}.apk"
          cp "$apk" "$output"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print -quit)"
          if [ -z "$apksigner_path" ]; then
            echo "::error::Android build tools did not provide apksigner."
            exit 1
          fi
          "$apksigner_path" verify --verbose "$output"

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: MyAl-Client-${{ env.RELEASE_TAG }}.apk
